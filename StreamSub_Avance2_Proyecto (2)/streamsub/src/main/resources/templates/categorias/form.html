<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Categoría</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container my-4" style="max-width:600px;">
  <h2 th:text="${categoria.idCategoria} != null ? 'Editar Categoría' : 'Nueva Categoría'"></h2>
  <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post" class="card p-4 shadow-sm">
    <input type="hidden" th:field="*{idCategoria}">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
    </div>
    <div class="form-check mb-3">
      <input type="checkbox" class="form-check-input" th:field="*{activo}">
      <label class="form-check-label">Activo</label>
    </div>
    <button type="submit" class="btn btn-streamsub">Guardar</button>
    <a th:href="@{/categorias}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div>
</body>
</html>
