<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Categorías</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Categorías</h2>
    <a class="btn btn-streamsub" th:href="@{/categorias/nuevo}">+ Nueva categoría</a>
  </div>
  <table class="table table-bordered table-hover bg-white">
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr th:each="c : ${categorias}">
        <td th:text="${c.idCategoria}"></td>
        <td th:text="${c.nombre}"></td>
        <td th:text="${c.descripcion}"></td>
        <td>
          <span th:if="${c.activo}" class="badge bg-success">Activo</span>
          <span th:unless="${c.activo}" class="badge bg-secondary">Inactivo</span>
        </td>
        <td>
          <a class="btn btn-sm btn-outline-dark" th:href="@{'/categorias/editar/' + ${c.idCategoria}}">Editar</a>
          <a class="btn btn-sm btn-outline-danger" th:href="@{'/categorias/eliminar/' + ${c.idCategoria}}"
             onclick="return confirm('¿Desactivar esta categoría?');">Desactivar</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
