<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Contacto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container my-4">
  <h2>Contáctanos</h2>
  <p class="text-muted">¿Tienes dudas sobre tu suscripción o método de pago? Escríbenos.</p>
  <div class="row">
    <div class="col-md-6">
      <form>
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" placeholder="Tu nombre">
        </div>
        <div class="mb-3">
          <label class="form-label">Correo</label>
          <input type="email" class="form-control" placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Mensaje</label>
          <textarea class="form-control" rows="4" placeholder="Escribe tu consulta"></textarea>
        </div>
        <button type="button" class="btn btn-streamsub">Enviar (demo)</button>
      </form>
    </div>
    <div class="col-md-6">
      <h5>Datos de contacto</h5>
      <p>📍 Av. Streaming 123, Lima, Perú</p>
      <p>📞 (01) 555-0100</p>
      <p>✉️ soporte@streamsub.com</p>
    </div>
  </div>
</div>
</body>
</html>
