<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Contenido</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container my-4" style="max-width:700px;">
  <h2 th:text="${contenido.idContenido} != null ? 'Editar Contenido' : 'Nuevo Contenido'"></h2>
  <form th:action="@{/contenidos/guardar}" th:object="${contenido}" method="post" class="card p-4 shadow-sm">
    <input type="hidden" th:field="*{idContenido}">
    <div class="mb-3">
      <label class="form-label">Título</label>
      <input type="text" class="form-control" th:field="*{titulo}" required>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Tipo</label>
        <select class="form-select" th:field="*{tipo}">
          <option value="Película">Película</option>
          <option value="Serie">Serie</option>
        </select>
      </div>
      <div class="col-md-3 mb-3">
        <label class="form-label">Año</label>
        <input type="number" class="form-control" th:field="*{anioLanzamiento}">
      </div>
      <div class="col-md-3 mb-3">
        <label class="form-label">Duración (min)</label>
        <input type="number" class="form-control" th:field="*{duracionMin}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Sinopsis</label>
      <textarea class="form-control" th:field="*{sinopsis}" rows="3"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Categoría</label>
      <select class="form-select" th:field="*{idCategoria}">
        <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}" th:text="${cat.nombre}"></option>
      </select>
    </div>
    <button type="submit" class="btn btn-streamsub">Guardar</button>
    <a th:href="@{/contenidos}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div>
</body>
</html>
