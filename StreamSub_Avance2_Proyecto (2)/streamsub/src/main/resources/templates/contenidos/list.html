<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Contenido</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Catálogo de Contenido</h2>
    <a class="btn btn-streamsub" th:href="@{/contenidos/nuevo}">+ Nuevo contenido</a>
  </div>
  <table class="table table-bordered table-hover bg-white">
    <thead>
      <tr><th>ID</th><th>Título</th><th>Tipo</th><th>Año</th><th>Duración (min)</th><th>ID Categoría</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr th:each="c : ${contenidos}">
        <td th:text="${c.idContenido}"></td>
        <td th:text="${c.titulo}"></td>
        <td th:text="${c.tipo}"></td>
        <td th:text="${c.anioLanzamiento}"></td>
        <td th:text="${c.duracionMin}"></td>
        <td th:text="${c.idCategoria}"></td>
        <td>
          <a class="btn btn-sm btn-outline-dark" th:href="@{'/contenidos/editar/' + ${c.idContenido}}">Editar</a>
          <a class="btn btn-sm btn-outline-danger" th:href="@{'/contenidos/eliminar/' + ${c.idContenido}}"
             onclick="return confirm('¿Eliminar este contenido?');">Eliminar</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
