<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Iniciar sesión</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="card shadow" style="width: 380px;">
    <div class="card-header card-header-custom text-center">
      <h4 class="mb-0">StreamSub</h4>
      <small>Servicio de Suscripción a Streaming</small>
    </div>
    <div class="card-body">
      <p th:if="${param.error}" class="alert alert-danger">Usuario o contraseña incorrectos.</p>
      <p th:if="${param.logout}" class="alert alert-success">Sesión cerrada correctamente.</p>
      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" name="username" class="form-control" value="admin" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" value="admin123" required>
        </div>
        <button type="submit" class="btn btn-streamsub w-100">Ingresar</button>
      </form>
      <p class="text-muted mt-3 mb-0" style="font-size:0.8rem;">Credenciales dummy: admin / admin123</p>
    </div>
  </div>
</div>
</body>
</html>
