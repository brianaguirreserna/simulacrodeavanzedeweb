<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Método de Pago</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container my-4" style="max-width:600px;">
  <h2 th:text="${metodoPago.idMetodoPago} != null ? 'Editar Método de Pago' : 'Nuevo Método de Pago'"></h2>
  <form th:action="@{/metodos-pago/guardar}" th:object="${metodoPago}" method="post" class="card p-4 shadow-sm">
    <input type="hidden" th:field="*{idMetodoPago}">
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <select class="form-select" th:field="*{idUsuario}">
        <option th:each="u : ${usuarios}" th:value="${u.idUsuario}" th:text="${u.nombreCompleto}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Tipo</label>
      <select class="form-select" th:field="*{tipo}">
        <option value="Tarjeta de crédito">Tarjeta de crédito</option>
        <option value="Tarjeta de débito">Tarjeta de débito</option>
        <option value="Billetera digital">Billetera digital</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Titular</label>
      <input type="text" class="form-control" th:field="*{titular}">
    </div>
    <div class="mb-3">
      <label class="form-label">Número (enmascarado)</label>
      <input type="text" class="form-control" th:field="*{numeroEnmascarado}" placeholder="**** **** **** 1234">
    </div>
    <div class="mb-3">
      <label class="form-label">Fecha de vencimiento (MM/AA)</label>
      <input type="text" class="form-control" th:field="*{fechaVencimiento}" placeholder="12/27">
    </div>
    <div class="mb-3">
      <label class="form-label">Estado</label>
      <select class="form-select" th:field="*{estado}">
        <option value="Vigente">Vigente</option>
        <option value="Vencido">Vencido</option>
      </select>
    </div>
    <button type="submit" class="btn btn-streamsub">Guardar</button>
    <a th:href="@{/metodos-pago}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div>
</body>
</html>
