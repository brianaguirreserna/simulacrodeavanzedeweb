<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Métodos de Pago</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Métodos de Pago</h2>
    <a class="btn btn-streamsub" th:href="@{/metodos-pago/nuevo}">+ Nuevo método de pago</a>
  </div>
  <table class="table table-bordered table-hover bg-white">
    <thead>
      <tr><th>ID</th><th>ID Usuario</th><th>Tipo</th><th>Titular</th><th>Número</th><th>Vencimiento</th><th>Estado</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr th:each="m : ${metodosPago}">
        <td th:text="${m.idMetodoPago}"></td>
        <td th:text="${m.idUsuario}"></td>
        <td th:text="${m.tipo}"></td>
        <td th:text="${m.titular}"></td>
        <td th:text="${m.numeroEnmascarado}"></td>
        <td th:text="${m.fechaVencimiento}"></td>
        <td>
          <span th:if="${m.estado == 'Vigente'}" class="badge bg-success" th:text="${m.estado}"></span>
          <span th:unless="${m.estado == 'Vigente'}" class="badge bg-danger" th:text="${m.estado}"></span>
        </td>
        <td>
          <a class="btn btn-sm btn-outline-dark" th:href="@{'/metodos-pago/editar/' + ${m.idMetodoPago}}">Editar</a>
          <a class="btn btn-sm btn-outline-danger" th:href="@{'/metodos-pago/eliminar/' + ${m.idMetodoPago}}"
             onclick="return confirm('¿Eliminar este método de pago?');">Eliminar</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
