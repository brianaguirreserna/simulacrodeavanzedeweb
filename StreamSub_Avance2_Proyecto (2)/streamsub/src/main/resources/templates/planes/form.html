<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Plan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container my-4" style="max-width:600px;">
  <h2 th:text="${plan.idPlan} != null ? 'Editar Plan' : 'Nuevo Plan'"></h2>
  <form th:action="@{/planes/guardar}" th:object="${plan}" method="post" class="card p-4 shadow-sm">
    <input type="hidden" th:field="*{idPlan}">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Precio mensual (S/.)</label>
      <input type="number" step="0.01" class="form-control" th:field="*{precioMensual}">
    </div>
    <div class="mb-3">
      <label class="form-label">Calidad de video</label>
      <select class="form-select" th:field="*{calidadVideo}">
        <option value="SD">SD</option>
        <option value="HD">HD</option>
        <option value="4K">4K</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Pantallas simultáneas</label>
      <input type="number" class="form-control" th:field="*{pantallasSimultaneas}">
    </div>
    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea class="form-control" th:field="*{descripcion}" rows="2"></textarea>
    </div>
    <button type="submit" class="btn btn-streamsub">Guardar</button>
    <a th:href="@{/planes}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div>
</body>
</html>
