<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Planes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Planes de Suscripción</h2>
    <a class="btn btn-streamsub" th:href="@{/planes/nuevo}">+ Nuevo plan</a>
  </div>
  <table class="table table-bordered table-hover bg-white">
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Precio (S/.)</th><th>Calidad</th><th>Pantallas</th><th>Descripción</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr th:each="p : ${planes}">
        <td th:text="${p.idPlan}"></td>
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.precioMensual}"></td>
        <td th:text="${p.calidadVideo}"></td>
        <td th:text="${p.pantallasSimultaneas}"></td>
        <td th:text="${p.descripcion}"></td>
        <td>
          <a class="btn btn-sm btn-outline-dark" th:href="@{'/planes/editar/' + ${p.idPlan}}">Editar</a>
          <a class="btn btn-sm btn-outline-danger" th:href="@{'/planes/eliminar/' + ${p.idPlan}}"
             onclick="return confirm('¿Eliminar este plan?');">Eliminar</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
