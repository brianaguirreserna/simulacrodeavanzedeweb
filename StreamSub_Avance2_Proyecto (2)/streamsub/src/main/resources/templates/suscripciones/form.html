<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Suscripción</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container my-4" style="max-width:650px;">
  <h2 th:text="${suscripcion.idSuscripcion} != null ? 'Editar Suscripción' : 'Nueva Suscripción'"></h2>
  <form th:action="@{/suscripciones/guardar}" th:object="${suscripcion}" method="post" class="card p-4 shadow-sm">
    <input type="hidden" th:field="*{idSuscripcion}">
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <select class="form-select" th:field="*{idUsuario}">
        <option th:each="u : ${usuarios}" th:value="${u.idUsuario}" th:text="${u.nombreCompleto}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Plan</label>
      <select class="form-select" th:field="*{idPlan}">
        <option th:each="p : ${planes}" th:value="${p.idPlan}" th:text="${p.nombre} + ' - S/. ' + ${p.precioMensual}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Método de pago</label>
      <select class="form-select" th:field="*{idMetodoPago}">
        <option th:each="m : ${metodosPago}" th:value="${m.idMetodoPago}"
                th:text="${m.tipo} + ' (' + ${m.numeroEnmascarado} + ') - ' + ${m.estado}"></option>
      </select>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Fecha inicio</label>
        <input type="date" class="form-control" th:field="*{fechaInicio}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Fecha fin</label>
        <input type="date" class="form-control" th:field="*{fechaFin}">
      </div>
    </div>
    <div class="form-check mb-3">
      <input type="checkbox" class="form-check-input" th:field="*{renovacionAutomatica}">
      <label class="form-check-label">Renovación automática</label>
    </div>
    <div class="mb-3">
      <label class="form-label">Estado</label>
      <select class="form-select" th:field="*{estado}">
        <option value="Activa">Activa</option>
        <option value="Cancelada">Cancelada</option>
        <option value="Vencida">Vencida</option>
      </select>
    </div>
    <button type="submit" class="btn btn-streamsub">Guardar</button>
    <a th:href="@{/suscripciones}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div>
</body>
</html>
