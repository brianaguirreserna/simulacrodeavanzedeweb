<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Suscripciones</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Suscripciones</h2>
    <a class="btn btn-streamsub" th:href="@{/suscripciones/nuevo}">+ Nueva suscripción</a>
  </div>
  <table class="table table-bordered table-hover bg-white">
    <thead>
      <tr><th>ID</th><th>ID Usuario</th><th>ID Plan</th><th>ID Método Pago</th><th>Inicio</th><th>Fin</th><th>Renov. Autom.</th><th>Estado</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr th:each="s : ${suscripciones}">
        <td th:text="${s.idSuscripcion}"></td>
        <td th:text="${s.idUsuario}"></td>
        <td th:text="${s.idPlan}"></td>
        <td th:text="${s.idMetodoPago}"></td>
        <td th:text="${s.fechaInicio}"></td>
        <td th:text="${s.fechaFin}"></td>
        <td th:text="${s.renovacionAutomatica} ? 'Sí' : 'No'"></td>
        <td th:text="${s.estado}"></td>
        <td>
          <a class="btn btn-sm btn-outline-dark" th:href="@{'/suscripciones/editar/' + ${s.idSuscripcion}}">Editar</a>
          <a class="btn btn-sm btn-outline-warning" th:href="@{'/suscripciones/cancelar/' + ${s.idSuscripcion}}">Cancelar</a>
          <a class="btn btn-sm btn-outline-danger" th:href="@{'/suscripciones/eliminar/' + ${s.idSuscripcion}}"
             onclick="return confirm('¿Eliminar este registro?');">Eliminar</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
