<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Usuario</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container my-4" style="max-width:600px;">
  <h2 th:text="${usuario.idUsuario} != null ? 'Editar Usuario' : 'Nuevo Usuario'"></h2>
  <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="card p-4 shadow-sm">
    <input type="hidden" th:field="*{idUsuario}">
    <div class="mb-3">
      <label class="form-label">Nombre completo</label>
      <input type="text" class="form-control" th:field="*{nombreCompleto}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" th:field="*{email}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Fecha de registro</label>
      <input type="date" class="form-control" th:field="*{fechaRegistro}">
    </div>
    <div class="mb-3">
      <label class="form-label">Estado</label>
      <select class="form-select" th:field="*{estado}">
        <option value="Activo">Activo</option>
        <option value="Inactivo">Inactivo</option>
      </select>
    </div>
    <button type="submit" class="btn btn-streamsub">Guardar</button>
    <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div>
</body>
</html>
