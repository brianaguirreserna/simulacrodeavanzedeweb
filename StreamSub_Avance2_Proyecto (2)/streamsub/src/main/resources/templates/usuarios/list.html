<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StreamSub - Usuarios</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Usuarios</h2>
    <a class="btn btn-streamsub" th:href="@{/usuarios/nuevo}">+ Nuevo usuario</a>
  </div>
  <table class="table table-bordered table-hover bg-white">
    <thead>
      <tr><th>ID</th><th>Nombre completo</th><th>Email</th><th>Fecha registro</th><th>Estado</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr th:each="u : ${usuarios}">
        <td th:text="${u.idUsuario}"></td>
        <td th:text="${u.nombreCompleto}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.fechaRegistro}"></td>
        <td>
          <span th:if="${u.estado == 'Activo'}" class="badge bg-success" th:text="${u.estado}"></span>
          <span th:unless="${u.estado == 'Activo'}" class="badge bg-secondary" th:text="${u.estado}"></span>
        </td>
        <td>
          <a class="btn btn-sm btn-outline-dark" th:href="@{'/usuarios/editar/' + ${u.idUsuario}}">Editar</a>
          <a class="btn btn-sm btn-outline-danger" th:href="@{'/usuarios/eliminar/' + ${u.idUsuario}}"
             onclick="return confirm('¿Eliminar este usuario?');">Eliminar</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
